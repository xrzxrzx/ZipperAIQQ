name: CI

# 目标：让 PR「绿了再 review」，而不是 maintainer 手工验每一次。
# 公开仓库使用 GitHub 托管的 runner 是【免费且不限额度】的。
on:
  push:
    branches: [main, dev]   # dev 是 AI 的开发分支，守卫必须也在那里生效
  pull_request:
  workflow_dispatch:

# 最小权限：这个工作流只需要读代码
permissions:
  contents: read

# 同一分支的新推送会取消上一次还在跑的，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────
  # ① 文档与契约 —— 仓库现在就有内容，所以这个作业【当前就在真正干活】
  # ───────────────────────────────────────────────────────────────────
  docs-and-contracts:
    name: 文档与契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 边界守卫：内部资料是独立私有仓库，不该被提交到这里
      # （协作方需要在自己机器上把该目录加进 .git/info/exclude，见 CONTRIBUTING.md 第三节）
      - name: 守卫 —— 内部资料目录不得入库
        run: |
          if [ -d "ai-docs" ] && [ -n "$(git ls-files ai-docs)" ]; then
            echo "::error::检测到内部资料目录被提交入库。它是独立的私有仓库，不应出现在这里。"
            echo "::error::如果你本地需要它，请把它加进 .git/info/exclude（不要用 .gitignore）。"
            exit 1
          fi
          echo "OK：内部资料目录未入库。"

      # ─────────────────────────────────────────────────────────────────
      # 敏感信息守卫（2026-10-21 新增）
      # 由来：AI 把验收输出里的真实 QQ 号直接抄进了文档，违反了同一天定的
      #      「账号也算敏感信息」规则。既然"记住"失败过两次，就改成机械检查。
      #
      # 设计取舍：**强检测失败、弱检测只警告**。
      #   - 强检测（明确的证据）：qq:g<数字> / qq:p<数字> 形态，以及真实内网 IP → 直接失败
      #   - 弱检测（可能误报）：孤立的长数字串 → 只警告，由人确认
      # 理由：老是误报的检查器，人就会开始忽略它（本文件里已经写过一次这句话）。
      # ─────────────────────────────────────────────────────────────────
      - name: 守卫 —— 仓库中不得出现真实账号 / 内网地址
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          tracked = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout
          exts = (".md", ".json", ".cs", ".yml", ".yaml", ".ps1", ".csproj", ".slnx", ".txt", ".example")
          files = [f for f in tracked.splitlines() if f and f.endswith(exts)]

          ALLOW_NUMS = {"1000000000", "1234567890", "123456789"}
          ALLOW_IPS  = {"127.0.0.1"}

          # 会话号只查 ≥8 位：真实 QQ 号是 9~11 位，而代码注释里的示例是 6 位（qq:g123456）。
          # 这个下限是「减少误报」的关键 —— 误报多了守卫就会被无视。
          session_pat = re.compile(r'qq:[pg](\d{8,})')

          # IP 必须**完整四段**。只写前缀会命中文档里的包版本号（如 10.0.13）。
          ip_pat = re.compile(
              r'\b(?:192\.168\.\d{1,3}\.\d{1,3}'
              r'|10\.\d{1,3}\.\d{1,3}\.\d{1,3}'
              r'|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b')

          num_pat = re.compile(r'(?<![\d.])(\d{9,11})(?![\d.])')

          errors, warns = [], []

          for f in files:
              try:
                  text = open(f, encoding="utf-8").read()
              except Exception:
                  continue

              # 强检测 1：会话 ID 里的号码
              for m in session_pat.finditer(text):
                  num = m.group(1)
                  if num not in ALLOW_NUMS:
                      errors.append(f"{f}: 会话 ID 含疑似真实账号 —— qq:?{num}")

              # 强检测 2：真实内网 IP（占位写法 192.168.x.x 不会命中）
              for m in ip_pat.finditer(text):
                  if m.group(0) not in ALLOW_IPS:
                      errors.append(f"{f}: 疑似真实内网地址 —— {m.group(0)}")

              # 弱检测：孤立长数字（只警告）
              for m in num_pat.finditer(text):
                  n = m.group(1)
                  if n in ALLOW_NUMS:
                      continue
                  if len(n) == 10 and n.startswith(("16", "17", "18", "19")):
                      continue   # 多半是 Unix 时间戳
                  warns.append(f"{f}: 孤立数字串 {n}（请确认不是 QQ 号）")

          for w in warns[:20]:
              print(f"::warning::{w}")
          if len(warns) > 20:
              print(f"::warning::……还有 {len(warns) - 20} 条弱警告")

          if errors:
              print("::error::发现疑似真实账号 / 内网地址（见 AGENTS.md §七：一律用占位符）")
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)

          print(f"OK：扫描 {len(files)} 个文件，未发现真实账号或内网地址。")
          PY



      # 这条正是 2026-09-22 抓到真实 QQ 号泄漏的那类检查，所以固化下来
      - name: 校验契约样例（合法 JSON + 身份字段必须是占位值）
        run: |
          python3 - <<'PY'
          import glob, json, re, sys

          IDENT = re.compile(r'^(selfu?in|user_?id|group_?id|uin|qq|nickname|group_?name)$', re.I)
          # 允许的占位值 —— 新增占位号请加到这里
          ALLOW = {"1000000000", "10001", "1234567890", "123456789", "示例昵称", "示例群名"}

          files = sorted(glob.glob("docs/05-契约/**/*.json", recursive=True))
          if not files:
              print("::error::docs/05-契约/ 下没有找到任何样例文件")
              sys.exit(1)

          problems = []

          def walk(node, path, fname):
              if isinstance(node, dict):
                  for k, v in node.items():
                      if IDENT.match(str(k)) and isinstance(v, (int, str)):
                          if str(v) not in ALLOW:
                              problems.append(f"{fname}: {path}.{k} = {v!r} 疑似真实值")
                      walk(v, f"{path}.{k}", fname)
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      walk(v, f"{path}[{i}]", fname)

          for f in files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      data = json.load(fh)
              except Exception as e:
                  problems.append(f"{f}: JSON 解析失败 —— {e}")
                  continue
              walk(data, "", f)
              print(f"OK  {f}")

          if problems:
              print("::error::契约样例检查未通过（本目录会随代码公开）")
              for p in problems:
                  print(f"::error::{p}")
              print("::error::身份字段只允许使用占位值，见 docs/05-契约/README.md")
              sys.exit(1)

          print(f"共 {len(files)} 个样例，全部合法且身份字段均为占位值。")
          PY

      - name: 检查 Markdown 相对链接是否失效
        run: |
          python3 - <<'PY'
          import os, re, sys

          root = os.getcwd()
          # 必须先剥掉代码块与行内代码：文档里举例写的 ](path) 不是真链接。
          # 老是误报的检查器，人就会开始忽略它。
          fence  = re.compile(r"```.*?```", re.S)
          inline = re.compile(r"`[^`\n]*`")
          link   = re.compile(r"\]\(([^)]+)\)")

          bad = []
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames[:] = [d for d in dirnames if d != ".git"]
              for fn in filenames:
                  if not fn.endswith(".md"):
                      continue
                  path = os.path.join(dirpath, fn)
                  with open(path, encoding="utf-8") as fh:
                      text = fh.read()
                  text = fence.sub("", text)
                  text = inline.sub("", text)
                  for m in link.finditer(text):
                      target = m.group(1).strip()
                      if target.startswith(("http://", "https://", "mailto:", "#")):
                          continue
                      target = target.split("#")[0]
                      if not target:
                          continue
                      resolved = os.path.normpath(os.path.join(dirpath, target))
                      if not os.path.exists(resolved):
                          bad.append(f"{os.path.relpath(path, root)} -> {target}")

          if bad:
              print("::error::发现失效的相对链接")
              for b in bad:
                  print(f"::error::{b}")
              sys.exit(1)
          print("OK：没有断链的相对链接。")
          PY

  # ───────────────────────────────────────────────────────────────────
  # ② 构建与测试 —— 仓库已有 .NET 项目，本作业正在真正干活
  # ───────────────────────────────────────────────────────────────────
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 探测逻辑保留：万一仓库被清空，不至于红一片。
      # 没有项目时【如实跳过并打 notice】，而不是假装成功。
      - name: 探测是否存在 .NET 项目
        id: probe
        run: |
          shopt -s nullglob
          found=false
          for f in *.sln *.slnx *.slnf; do
            if [ -f "$f" ]; then found=true; fi
          done
          if [ "$found" = false ] && [ -d src ] && [ -n "$(find src -name '*.csproj' -print -quit)" ]; then
            found=true
          fi
          if [ "$found" = false ] && [ -d tests ] && [ -n "$(find tests -name '*.csproj' -print -quit)" ]; then
            found=true
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" = false ]; then
            echo "::notice::仓库里暂时没有 .NET 项目，跳过构建与测试（探测逻辑保留，出现 .csproj 后自动恢复）。"
          fi

      - name: 安装 .NET SDK
        if: steps.probe.outputs.found == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          # ⚠️ 这里【不要】写 cache: true —— setup-dotnet 的缓存要求仓库里有 packages.lock.json，
          #    没有的话【会直接抛错】（见该 action 的 README：If lock file does not exist, this action throws error）。
          #    本项目目前没启用 NuGet 锁文件，所以关掉缓存。
          #    将来若在 Directory.Build.props 里开 <RestorePackagesWithLockFile>true</RestorePackagesWithLockFile>
          #    并把 packages.lock.json 提交进仓库，才可以打开 cache 并配 cache-dependency-path。
          cache: false

      # 跨平台硬约束：除 Client（WinUI3）外都必须能在 Linux 构建
      - name: 还原
        if: steps.probe.outputs.found == 'true'
        run: dotnet restore

      - name: 构建（Release，警告视为错误）
        if: steps.probe.outputs.found == 'true'
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: 测试
        if: steps.probe.outputs.found == 'true'
        run: |
          # 探测是否存在测试项目。
          # 原因：没有测试项目时，dotnet test 会「成功退出但一个测试都没跑」，
          # 那看起来像"测试通过"，其实是误导 —— 本项目定过一条原则：如实跳过，不假装成功。
          shopt -s nullglob
          has_tests=false
          for f in tests/*.csproj ZipperAIQQ.*/*.Tests.csproj ZipperAIQQ.*/*Test*/*.csproj; do
            if [ -f "$f" ]; then has_tests=true; fi
          done
          if [ "$has_tests" = false ]; then
            echo "::notice::仓库里还没有测试项目 —— 本次「测试」步骤实际未验证任何东西（0 个测试）。这【不等于】测试通过。"
            exit 0
          fi
          dotnet test --no-build --configuration Release --verbosity normal
